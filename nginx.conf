server {
  listen 80;
  server_name mehra.tyagi.fun;

  # redirect all http to https
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name mehra.tyagi.fun;

  ssl_certificate     /etc/nginx/ssl/full.crt;
  ssl_certificate_key /etc/nginx/ssl/private.key;

  # if your CA issued an intermediate (ca.crt), nginx wants it
  # concatenated AFTER your cert, not as a separate directive.
  # see note below on creating fullchain.crt

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }
}