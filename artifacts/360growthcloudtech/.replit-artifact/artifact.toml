kind = "web"
previewPath = "/"
title = "360GrowthCloudTech"
version = "1.0.0"
id = "artifacts/360growthcloudtech"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19909

[services.development]
run = "pnpm --filter @workspace/360growthcloudtech run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/360growthcloudtech", "run", "build" ]
publicDir = "artifacts/360growthcloudtech/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19909"
BASE_PATH = "/"
