name: Rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to rollback to (for example: a1b2c3d4e5f6)'
        required: true
        type: string

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/360growthcloudtech

jobs:
  rollback:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull selected image tag
        run: docker pull ${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}

      - name: Stop old container
        run: docker rm -f 360growthcloudtech || true

      - name: Start rollback container
        run: docker run -d --name 360growthcloudtech -p 80:80 ${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}

