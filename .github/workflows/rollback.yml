name: Rollback

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Git SHA of the image to roll back to (the full commit SHA used as the Docker tag)"
        required: true
        type: string

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/360growthcloudtech

jobs:
  rollback:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull rollback image
        run: docker pull ${{ env.IMAGE_NAME }}:${{ github.event.inputs.git_sha }}

      - name: Stop current container
        run: docker rm -f 360growthcloudtech || true

      - name: Start rollback container
        run: docker run -d --name 360growthcloudtech -p 80:80 ${{ env.IMAGE_NAME }}:${{ github.event.inputs.git_sha }}

      - name: Confirm running image
        run: |
          docker inspect 360growthcloudtech --format="Running image: {{.Config.Image}}"